{% extends "base.html" %}
{% load static %}

{% block title %}Create Item{% endblock title %}

{% block extra_css_files %}
    <link rel="stylesheet" href="{% static "item/item_create_view.css" %}">
{% endblock extra_css_files %}

{% block content %}
    <div class="create-character-div">
        <h2>Create a new item</h2>
        <form action="" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Save Item">
        </form>
    </div>
{% endblock content %}
