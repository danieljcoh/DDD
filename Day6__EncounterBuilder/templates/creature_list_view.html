{% extends "base.html" %}

{% block title %}<title>TITLE</title>{% endblock title %}

{% block content %}
    <a href="{% url "creature_create_view" %}">Create a new creature</a>
    <ul>
        {% for creature in creature_list %}
            <li><a href="{% url "creature_detail_view" creature.pk %}">{{ creature.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock content %}
