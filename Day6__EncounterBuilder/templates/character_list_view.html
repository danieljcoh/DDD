{% extends "base.html" %}

{% block title %}<title>TITLE</title>{% endblock title %}

{% block content %}
    <a href="{% url "character_create_view" %}">Create a new character</a>
    <ul>
        {% for character in character_list %}
            <li><a href="{% url "character_detail_view" character.pk %}">{{ character.player_name }} is playing: {{ character.player_character_name }}</a></li>
        {% endfor %}
    </ul>
{% endblock content %}
